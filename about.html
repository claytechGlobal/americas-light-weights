<script src="assets/runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: false, open: 0 }; }
  renderVals() {
    const F = [
      ['How do I contact Americas Lite Weights?', 'Call (347) 751-6818, email info@americasliteweights.com, or use the contact form above.'],
      ['Is checkout secure?', 'Yes. Payments are processed by Stripe over an encrypted connection, and card numbers are never stored on our servers.'],
      ['Do I need an account to order?', 'No. You can check out as a guest, or create an account to view order history and tracking.'],
      ['How long does shipping take?', '[Processing and delivery times as confirmed by the company.] See our Shipping Policy.'],
      ['What is your return policy?', '[Return window and conditions as confirmed by the company.] See our Return & Refund Policy.']
    ];
    return {
      sent: this.state.sent, notSent: !this.state.sent,
      send: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); },
      faqs: F.map((f, i) => { const o = this.state.open === i; return { q: f[0], a: f[1], isOpen: o, open: o ? 'true' : 'false', sign: o ? '−' : '+', toggle: () => this.setState({ open: o ? -1 : i }) }; })
    };
  }
}

DC.mount(Component);
</script>
