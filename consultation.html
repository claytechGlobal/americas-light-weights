<sc-for list="{{pk.items}}" as="it" hint-placeholder-count="5">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{pk.check}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px;"><polyline points="20 6 9 17 4 12"></polyline></svg>

</sc-for>
</ul>
<a class="btn" href="#booking" onClick="{{pk.choose}}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: {{pk.btnBg}}; color: {{pk.btnFg}}; font-weight: 700; font-size: 16px; text-decoration: none; margin-top: 8px;">{{pk.cta}}</a>

<span style="color: #3D414B;">32 Court St. STE 904, Brooklyn, NY 11201</span>

<div style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 28px;">
<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="cs-package" style="font-weight: 700; font-size: 14px;">Consultation package</label>
<select id="cs-package" value="{{pkg}}" onChange="{{setPkg}}" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CCD4; font-size: 16px; font-family: inherit; background: #FFFFFF;">

<option value="Fitness Transformation Consultation — $700">Fitness Transformation Consultation — $700</option>
<option value="Elite Fitness &amp; Wellness Coaching — $1,500">Elite Fitness &amp; Wellness Coaching — $1,500</option>
</select>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="cs-name" style="font-weight: 700; font-size: 14px;">Full name</label><input id="cs-name" required="required" autocomplete="name" value="{{name}}" onChange="{{setName}}" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CCD4; font-size: 16px; font-family: inherit;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="cs-email" style="font-weight: 700; font-size: 14px;">Email address</label><input id="cs-email" type="email" required="required" autocomplete="email" value="{{email}}" onChange="{{setEmail}}" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CCD4; font-size: 16px; font-family: inherit;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="cs-phone" style="font-weight: 700; font-size: 14px;">Phone (optional)</label><input id="cs-phone" type="tel" autocomplete="tel" value="{{phone}}" onChange="{{setPhone}}" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CCD4; font-size: 16px; font-family: inherit;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="cs-date" style="font-weight: 700; font-size: 14px;">Preferred date</label><input id="cs-date" type="date" min="{{today}}" value="{{date}}" onChange="{{setDate}}" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CCD4; font-size: 16px; font-family: inherit;"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="cs-msg" style="font-weight: 700; font-size: 14px;">Goals or questions (optional)</label><textarea id="cs-msg" rows="5" placeholder="Tell us what you'd like help with..." value="{{message}}" onChange="{{setMessage}}" style="padding: 14px; border-radius: 12px; border: 1px solid #C9CCD4; font-size: 16px; font-family: inherit; resize: vertical;"></textarea></div>
<button type="submit" class="btn" style="align-self: flex-start; min-height: 52px; padding: 0 32px; border-radius: 999px; border: 0; background: #1F4FFF; color: #FFFFFF; font-weight: 700; font-size: 17px; font-family: inherit; cursor: pointer;">Send Consultation Request →</button>
<p style="margin: 0; font-size: 13px; color: #3D414B;">No appointment or payment is confirmed automatically. Our team will contact you to schedule.</p>

<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3D414B;">Your request for the <strong>{{pkg}}</strong> package is ready. Send it to our team by email and we'll follow up to confirm your date.</p>
<a class="btn" href="{{mailto}}" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; background: #0B0B0F; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none;">Open email to send request</a>
<button type="button" onClick="{{edit}}" style="border: 0; background: none; padding: 6px 0; color: #1F4FFF; font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer;">← Edit request</button>

</div>

<div id="dc-root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Please enable JavaScript to view this site.</p></noscript>
<script src="assets/runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pkg: 'Fitness Transformation Consultation — $700', name: '', email: '', phone: '', date: '', message: '', sent: false };
  }
  renderVals() {
    const s = this.state;
    const D = [
      { tag: 'Package 01', name: 'Fitness Starter Consultation', price: '$250', detail: '1 private session · 60 minutes weekly', blurb: 'Ideal for beginners building confidence and a practical workout routine.', cta: 'Choose Starter', popular: false,
        items: ['Personal fitness goal assessment', 'Beginner-friendly workout guidance', 'Dumbbell exercise demonstrations', 'Personalized 7-day workout outline', 'Equipment recommendations'] },
      { tag: 'Package 02', name: 'Fitness Transformation Consultation', price: '$700', detail: '3 private sessions · 60 minutes weekly', blurb: 'More structure and follow-through for your next stage of fitness.', cta: 'Choose Transformation', popular: true,
        items: ['Comprehensive fitness assessment', 'Three one-on-one consultations', 'Customized 30-day workout plan', 'Strength and endurance guidance', 'Home equipment recommendations', 'Weekly progress review', 'Email support during the program'] },
      { tag: 'Package 03', name: 'Elite Fitness & Wellness Coaching', price: '$1,500', detail: '8 private sessions · 60 minutes weekly', blurb: 'Extended coaching and accountability for longer-term consistency.', cta: 'Choose Elite', popular: false,
        items: ['In-depth fitness and lifestyle assessment', 'Eight personalized coaching sessions', 'Customized 60-day fitness program', 'Progressive strength training guidance', 'Workout form reviews', 'Weekly accountability check-ins', 'Priority email support', 'Final progress evaluation'] }
    ];
    const packages = D.map((p) => {
      const dark = p.popular;
      return { ...p,
        bg: dark ? '#0B0B0F' : '#FFFFFF', fg: dark ? '#FFFFFF' : '#0B0B0F', border: dark ? '#0B0B0F' : '#E6E8EE',
        muted: dark ? '#C9CCD4' : '#3D414B', tagColor: dark ? '#FFD23F' : '#1F4FFF', check: dark ? '#FFD23F' : '#1F4FFF',
        btnBg: dark ? '#FFD23F' : '#0B0B0F', btnFg: '#0B0B0F' === (dark ? '#FFD23F' : '#0B0B0F') ? '#FFFFFF' : '#0B0B0F',
        choose: () => this.setState({ pkg: p.name + ' — ' + p.price, sent: false }) };
    });
    const t = new Date();
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const today = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
    const body = 'Name: ' + s.name + '\nEmail: ' + s.email + '\nPhone: ' + s.phone + '\nPackage: ' + s.pkg + '\nPreferred date: ' + s.date + '\n\nGoals/questions:\n' + s.message;
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    return {
      packages, today,
      pkg: s.pkg, name: s.name, email: s.email, phone: s.phone, date: s.date, message: s.message,
      setPkg: set('pkg'), setName: set('name'), setEmail: set('email'), setPhone: set('phone'), setDate: set('date'), setMessage: set('message'),
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); },
      edit: () => this.setState({ sent: false }),
      sent: s.sent, notSent: !s.sent,
      firstName: (s.name.trim().split(' ')[0]) || 'there',
      mailto: 'mailto:info@americasliteweights.com?subject=' + encodeURIComponent('AmeriLogics Consultation Request') + '&body=' + encodeURIComponent(body)
    };
  }
}

DC.mount(Component);
</script>
</body>
