  constructor(props) { super(props); this.state = { email: '', subscribed: false }; }

    const P = '#FF3D8B', Y = '#FFD23F', O = '#FF7A1A', B = '#1F4FFF', T = '#22C3E6';
    return {
      brand: this.props.brand ?? '#1F4FFF',
      email: this.state.email,
      setEmail: (e) => this.setState({ email: e.target.value }),
      subscribe: (e) => { if (e && e.preventDefault) e.preventDefault(); if (this.state.email.indexOf('@') > 0) this.setState({ subscribed: true }); },
      subscribed: this.state.subscribed,
      notSubscribed: !this.state.subscribed,
      shelves: [
        { items: [{ c: P, h: 40 }, { c: Y, h: 40 }, { c: O, h: 40 }, { c: B, h: 40 }] },
        { items: [{ c: T, h: 48 }, { c: P, h: 48 }, { c: Y, h: 48 }, { c: O, h: 48 }] },
        { items: [{ c: B, h: 56 }, { c: T, h: 56 }, { c: P, h: 56 }] }
      ],
      featured: [
        { category: 'Neoprene Dumbbells', name: 'AmeriLogics 3 LB Dumbbells', detail: 'Pair of 3 LB dumbbells', price: '$14.99', tint: '#FEDFED', img: 'assets/dumbbells-3lb.jpg' },
        { category: 'Dumbbell Sets', name: 'AmeriLogics Dumbbell Set', detail: '(3 LB, 5 LB, 8 LB) with Rack', price: '$79.99', tint: '#FFF3D1', img: 'assets/dumbbell-set.jpg' },
        { category: 'Storage & Organization', name: 'AmeriLogics Dumbbell Rack', detail: '(Holds 6 Weights)', price: '$29.99', tint: '#FDE8D9', img: 'assets/dumbbell-rack.jpg' },
        { category: 'Fitness Accessories', name: 'AmeriLogics Fitness Bundle', detail: 'Mat, Resistance Band, Jump Rope & Shaker', price: '$39.99', tint: '#E0E8FE', img: 'assets/fitness-bundle.jpg' }
      ],
      reasons: [
        { color: P, title: 'Easy to handle', body: 'Lightweight equipment that is comfortable to pick up, move and put away.' },
