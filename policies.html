<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Americas Lite Weights — Policies</title>
<meta name="description" content="Shipping, returns, privacy, terms, cookie and accessibility policies for Americas Lite Weights LLC.">
<meta property="og:title" content="Americas Lite Weights — Policies">
<meta property="og:description" content="Shipping, returns, privacy, terms, cookie and accessibility policies for Americas Lite Weights LLC.">
<meta property="og:image" content="assets/hero-lifestyle.jpg">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1F4FFF}a:hover{color:#0B2FB8}
</style>
<style>html{scroll-behavior:smooth}</style>
</head>
<body>
<template id="dc-template">

<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #0B0B0F; background: #FFFFFF; width: 100%;">

<div style="background: #0B0B0F; color: #FFFFFF; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; padding: 10px 16px; font-weight: 700;">Light Weights. Stronger You.</div>

<header style="border-bottom: 1px solid #E6E8EE; background: #FFFFFF;">
<div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0B0B0F;">
<img src="assets/logo.png" alt="AmeriLogics logo" style="height: 52px; width: auto; display: block;">
<span style="display: flex; flex-direction: column; line-height: 1;"><span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 20px; letter-spacing: -0.01em;">AMERICAS LITE WEIGHTS</span><span style="font-size: 11px; letter-spacing: 0.14em; color: #5A5F6B; margin-top: 4px;">LLC · BROOKLYN, NY</span></span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px;">
<a href="index.html" style="padding: 12px 14px; font-weight: 500; color: #0B0B0F; text-decoration: none;">Home</a>
<a href="shop.html" style="padding: 12px 14px; font-weight: 500; color: #0B0B0F; text-decoration: none;">Shop</a>
<a href="consultation.html" style="padding: 12px 14px; font-weight: 500; color: #0B0B0F; text-decoration: none;">Consultation</a>
<a href="about.html" style="padding: 12px 14px; font-weight: 500; color: #0B0B0F; text-decoration: none;">About</a>
<a href="about.html" style="padding: 12px 14px; font-weight: 500; color: #0B0B0F; text-decoration: none;">Contact</a>
<a href="cart.html" style="margin-left: 8px; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #0B0B0F; color: #FFFFFF; text-decoration: none; font-weight: 700;">Cart</a>
</nav>
</div>
</header>

<section style="background: #F4F6FB;">
<div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px;">
<h1 style="margin: 0 0 8px; font-family: Archivo, sans-serif; font-weight: 900; font-size: clamp(36px, 4.5vw, 56px); letter-spacing: -0.025em; text-transform: uppercase;">Policies &amp; Legal</h1>
<p style="margin: 0; font-size: 17px; color: #3D414B;">Last updated: [DATE]</p>
</div>
</section>

<div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 88px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;">
<nav aria-label="Policies" style="flex: 1 1 260px; max-width: 100%; display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{t.pick}}" aria-current="{{t.current}}" style="text-align: left; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">{{t.label}}</button>
</sc-for>
</nav>

<article style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<h2 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-size: 36px; letter-spacing: -0.02em;">{{title}}</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3D414B;">{{intro}}</p>
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h3 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 20px;">{{sec.h}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #3D414B;">{{sec.p}}</p>
</div>
</sc-for>
<div style="border-radius: 20px; background: #0B0B0F; color: #FFFFFF; padding: 24px 28px; font-size: 16px; line-height: 1.6;">
<strong style="font-family: Archivo, sans-serif; font-size: 18px;">Questions about this policy?</strong><br>
Americas Lite Weights LLC · 32 Court St. STE 904, Brooklyn, NY 11201<br>
Phone (347) 751-6818 · Fax (347) 751-6915 · <a href="mailto:info@americasliteweights.com" style="color: #FFD23F;">info@americasliteweights.com</a>
</div>
</article>
</div>

<footer style="background: #0B0B0F; color: #C9CCD4; border-top: 1px solid #2A2D35;">
<div style="max-width: 1240px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px;">
<span style="display: inline-flex; background: #FFFFFF; border-radius: 14px; padding: 10px 14px;"><img src="assets/logo.png" alt="AmeriLogics logo" style="height: 56px; width: auto; display: block;"></span>
<span>© 2026 Americas Lite Weights LLC · Secure checkout powered by Stripe</span>
</div>
</footer>
</div>
</template>
<div id="dc-root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Please enable JavaScript to view this site.</p></noscript>
<script src="assets/runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    const D = [
      { label: 'Shipping Policy', intro: 'This policy explains how Americas Lite Weights LLC processes and ships orders.', sections: [
        { h: 'Where we ship', p: '[Confirm shipping destinations.]' },
        { h: 'Processing time', p: '[Confirm how long orders take to prepare before shipping.]' },
        { h: 'Shipping methods & rates', p: 'Rates are calculated at checkout from your address and order. [Confirm carriers and any free-shipping offers.]' },
        { h: 'Tracking', p: 'Once your order ships, a confirmation email with tracking details is sent to the email used at checkout.' },
        { h: 'Damaged or lost packages', p: '[Confirm how customers report and resolve shipping issues.]' }
      ] },
      { label: 'Return & Refund Policy', intro: 'How returns, exchanges and refunds work at Americas Lite Weights LLC.', sections: [
        { h: 'Return window', p: '[Confirm the number of days and eligibility conditions.]' },
        { h: 'How to start a return', p: 'Contact us at info@americasliteweights.com or (347) 751-6818 with your order number. [Confirm the steps.]' },
        { h: 'Refunds', p: 'Approved refunds go back to the original payment method through Stripe. [Confirm timing and any fees.]' },
        { h: 'Non-returnable items', p: '[Confirm any exclusions.]' }
      ] },
      { label: 'Privacy Policy', intro: 'How Americas Lite Weights LLC collects, uses and protects your personal information.', sections: [
        { h: 'Information we collect', p: 'Information you provide, such as your name, email, shipping address and order details, plus [confirm analytics data collected].' },
        { h: 'Payments', p: 'Card payments are processed by Stripe. We do not store full card numbers on our servers.' },
        { h: 'How we use information', p: 'To fulfill orders, send order emails, answer inquiries and, with your consent, send our newsletter. [Confirm.]' },
        { h: 'Sharing', p: '[Confirm service providers, e.g. payment, shipping, email and analytics providers.]' },
        { h: 'Your choices', p: '[Confirm how customers can access, correct or delete their data and unsubscribe.]' }
      ] },
      { label: 'Terms & Conditions', intro: 'The terms that apply when you use this website and place an order.', sections: [
        { h: 'Orders & pricing', p: '[Confirm order acceptance, pricing errors and cancellation terms.]' },
        { h: 'Product use', p: '[Confirm safe-use and fitness disclaimer language reviewed by counsel.]' },
        { h: 'Limitation of liability', p: '[To be drafted with legal counsel.]' },
        { h: 'Governing law', p: '[Confirm, e.g. State of New York.]' }
      ] },
      { label: 'Cookie Policy', intro: 'How this website uses cookies and similar technologies.', sections: [
        { h: 'Essential cookies', p: 'Used to keep your cart and checkout working.' },
        { h: 'Analytics cookies', p: 'Used, with your consent, to understand site traffic (for example Google Analytics). [Confirm tools in use.]' },
        { h: 'Managing cookies', p: 'You can change your choice at any time from the cookie banner or your browser settings.' }
      ] },
      { label: 'Accessibility Statement', intro: 'Americas Lite Weights LLC wants everyone to be able to shop and use this website.', sections: [
        { h: 'Our approach', p: 'We design with readable text, keyboard-friendly navigation and labeled forms. [Confirm target standard, e.g. WCAG 2.2 AA, and testing status.]' },
        { h: 'Need help?', p: 'If you have trouble using any part of this site, call (347) 751-6818 or email info@americasliteweights.com and we will help you complete your order.' }
      ] }
    ];
    const cur = D[this.state.tab];
    return {
      tabs: D.map((d, i) => { const on = i === this.state.tab; return { label: d.label, current: on ? 'page' : 'false', bg: on ? '#0B0B0F' : '#F4F6FB', fg: on ? '#FFFFFF' : '#0B0B0F', pick: () => this.setState({ tab: i }) }; }),
      title: cur.label, intro: cur.intro, sections: cur.sections
    };
  }
}

DC.mount(Component);
</script>
</body>
</html>
