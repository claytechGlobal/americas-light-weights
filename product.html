<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { qty: 1, cart: 0, added: false, open: 0 }; }
  renderVals() {
    const s = this.state;
    const P = [
      { title: 'Specifications', body: 'Weights included: 3 LB, 5 LB, 8 LB\nRack: included\nMaterial / coating: [confirm]\nDimensions: [confirm]' },
      { title: 'Shipping', body: '[Shipping methods, rates and processing time as confirmed by Americas Lite Weights.]\nSee the full Shipping Policy for details.' },
      { title: 'Returns', body: '[Return window and conditions as confirmed by Americas Lite Weights.]\nSee the full Return & Refund Policy for details.' }
    ];
    return {
      qty: s.qty,
      lineTotal: '$' + (79.99 * s.qty).toFixed(2),
      inc: () => this.setState({ qty: Math.min(this.state.qty + 1, 99), added: false }),
      dec: () => this.setState({ qty: Math.max(this.state.qty - 1, 1), added: false }),
      add: () => this.setState({ cart: this.state.cart + this.state.qty, added: true }),
      added: s.added,
      cartCount: s.cart,
      panels: P.map((p, i) => { const o = s.open === i; return { ...p, isOpen: o, open: o ? 'true' : 'false', sign: o ? '−' : '+', toggle: () => this.setState({ open: o ? -1 : i }) }; }),
      related: [
        { cat: 'Neoprene Dumbbells', name: 'AmeriLogics 3 LB Dumbbells', detail: 'Pair of 3 LB dumbbells', price: '$14.99', tint: '#FEDFED', img: 'assets/dumbbells-3lb.jpg' },
        { cat: 'Storage & Organization', name: 'AmeriLogics Dumbbell Rack', detail: '(Holds 6 Weights)', price: '$29.99', tint: '#FDE8D9', img: 'assets/dumbbell-rack.jpg' },
        { cat: 'Fitness Accessories', name: 'AmeriLogics Fitness Bundle', detail: 'Mat, Resistance Band, Jump Rope & Shaker', price: '$39.99', tint: '#E0E8FE', img: 'assets/fitness-bundle.jpg' }
      ]
    };
  }
}

DC.mount(Component);
</script>
